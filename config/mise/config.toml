[tools]
"github:apppackio/apppack" = "latest"
"github:getsentry/cli" = "latest"
1password-cli = "latest"
aws-cli = { version = "latest", symlink_bins = true }
aws-vault = "latest"
bun = "latest"
chamber = "latest"
claude = "latest"
codex = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
just = "latest"
node = "25.2.1"
"npm:playwright" = "latest"
opencode = "latest"
ripgrep = "latest"
stripe = "latest"
terraform = "latest"
uv = "latest"
worktrunk = "latest"
zoxide = "latest"
cursor-agent = { version = "latest", bin_path = "dist-package", strip_components = 0, url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(x64="x64", arm64="arm64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/' }
