# Omarchy's bar inspects the PipeWire *sink node*, not the Bluetooth device.
# Shimmer reports form-factor=headphone on the device, but the sink is only
# named "Shimmer", so v4 shows a speaker instead of the old headphone glyph.
# Copy the headphone icon onto the playback node so isHeadphones() matches.

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
        node.description = "Shimmer"
      }
    ]
    actions = {
      update-props = {
        device.form-factor = "headphone"
        device.icon-name = "audio-headphones"
      }
    }
  }
]
