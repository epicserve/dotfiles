# The Wave:3 is a microphone with a headphone jack. PipeWire treats that jack
# as a USB headset (priority 1109), which beats ALC897 analog (1009) whenever
# Bluetooth headphones disconnect. Keep the jack selectable, but below ALC897
# so fallback is: Shimmer (when connected) -> ALC897 Analog.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Elgato_Systems_Elgato_Wave_3_*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 200
        priority.session = 200
      }
    }
  }
]
