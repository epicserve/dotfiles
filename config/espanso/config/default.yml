# Espanso global config (Wayland build).
# Docs: https://espanso.org/docs/configuration/basics/

# Wayland can't report the active layout to espanso, so declare it.
keyboard_layout:
  layout: "us"

# Search bar hotkey. Ctrl+Space is the herdr and tmux prefix, so the bar must
# live elsewhere. Espanso decodes physical keys and does not know about the
# altwin:swap_alt_win option in hypr/input.lua unless it is added under
# keyboard_layout, so espanso's META is the physical Win/Super key, which
# Hyprland sees as ALT: Alt+Space is unbound in Omarchy, herdr, tmux, and the
# editors. Espanso's default ALT+SPACE would land on Omarchy's Super+Space.
search_shortcut: "META+SPACE"
search_trigger: "off"
